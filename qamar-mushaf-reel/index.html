<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Qamar — Мусхаф (Reel)</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    /* Тема в цветах приложения: ночной фиолетовый + лаванда + кремовый */
    --bg-0: #0D0A1F;
    --bg-1: #2A2063;
    --accent: #B4A6FF;
    --text: #FFF7E8;
    --muted: rgba(255, 247, 232, .64);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg-0); }
  body { font-family: 'Manrope', sans-serif; color: var(--text); }

  #stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(120% 70% at 50% 18%, var(--bg-1) 0%, var(--bg-0) 64%); }
  #stars { position: absolute; inset: 0; }
  .star { position: absolute; border-radius: 50%; background: #fff; }
  #glow { position: absolute; width: 1400px; height: 1400px; left: -160px; top: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(180,166,255,.20) 0%, rgba(180,166,255,0) 60%); }

  /* ---------- Хук / CTA ---------- */
  .center-block { position: absolute; left: 0; right: 0; text-align: center; }
  #hook { top: 540px; }
  #moon { display: block; margin: 0 auto 56px; }
  .kicker { font-size: 30px; letter-spacing: .32em; font-weight: 700; color: var(--accent); }
  .headline { margin-top: 28px; font-size: 92px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; }
  .headline em { font-style: normal; color: var(--accent); }
  .sub { margin-top: 30px; font-size: 36px; color: var(--muted); font-weight: 500; }

  /* ---------- Подписи фич ---------- */
  #caption { position: absolute; left: 80px; right: 80px; top: 210px; height: 260px; }
  .cap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; }
  .cap .num { display: inline-flex; align-self: flex-start; align-items: center; gap: 14px;
    font-size: 26px; font-weight: 800; letter-spacing: .18em; color: var(--accent); }
  .cap .num::before { content: ''; width: 46px; height: 3px; background: var(--accent); border-radius: 2px; }
  .cap h2 { margin-top: 16px; font-size: 64px; line-height: 1.08; font-weight: 800; letter-spacing: -.015em; }

  /* ---------- iPad со скриншотами ---------- */
  #ipad-wrap { position: absolute; left: 160px; top: 510px; width: 760px; height: 1023px; transform-origin: 50% 50%; }
  #ipad { position: absolute; inset: 0; border-radius: 56px; background: linear-gradient(145deg,#2f2a45,#0e0c18);
    padding: 22px; box-shadow: 0 60px 120px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.08) inset; }
  #screen { position: relative; width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: #FFF7E8; }
  #content { position: absolute; inset: 0; }
  #content img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; }

  /* палец */
  #tap { position: absolute; width: 110px; height: 110px; margin: -55px 0 0 -55px; z-index: 20; pointer-events: none; opacity: 0; }
  #tap .dot { position: absolute; inset: 25px; border-radius: 50%; background: rgba(110,91,214,.55);
    box-shadow: 0 0 0 4px rgba(255,255,255,.9), 0 6px 24px rgba(0,0,0,.25); }
  #tap .ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid rgba(110,91,214,.9); }

  /* CTA */
  #cta { top: 600px; }
  .brand { font-size: 128px; font-weight: 800; letter-spacing: -.03em; }
  .store { display: inline-flex; align-items: center; gap: 16px; margin-top: 54px; padding: 26px 46px; border-radius: 26px;
    background: var(--accent); color: var(--bg-0); font-size: 38px; font-weight: 800; }
  .handle { margin-top: 34px; font-size: 30px; color: var(--muted); font-weight: 600; }

  /* прогресс */
  #dots { position: absolute; left: 0; right: 0; top: 1592px; display: flex; justify-content: center; gap: 14px; }
  #dots i { width: 14px; height: 14px; border-radius: 7px; background: rgba(255,247,232,.25); }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="stars"></div>

  <div id="hook" class="center-block">
    <svg id="moon" width="170" height="170" viewBox="0 0 100 100">
      <defs><mask id="cres"><rect width="100" height="100" fill="#fff"/><circle id="moon-cut" cx="66" cy="38" r="36" fill="#000"/></mask></defs>
      <circle cx="50" cy="50" r="40" fill="#B4A6FF" mask="url(#cres)"/>
    </svg>
    <div class="kicker" data-k="hook.kicker"></div>
    <div class="headline" data-k="hook.title"></div>
    <div class="sub" data-k="hook.sub"></div>
  </div>

  <div id="caption"></div>

  <div id="ipad-wrap">
    <div id="ipad">
      <div id="screen">
        <div id="content">
          <!-- слои скриншотов; порядок = порядок наложения -->
          <img id="L-page-zoom" src="screenshots/1-page-zoom.jpg">
          <img id="L-page" src="screenshots/2-page.jpg">
          <img id="L-card-top" src="screenshots/3-ayah-card.jpg">
          <img id="L-card" src="screenshots/3-ayah-card.jpg">
          <img id="L-audio-top" src="screenshots/4-audio.jpg">
          <img id="L-player" src="screenshots/4-audio.jpg">
          <img id="L-night" src="screenshots/5-night.jpg">
          <img id="L-note-top" src="screenshots/6-note.jpg">
          <img id="L-note-sheet" src="screenshots/6-note.jpg">
          <div id="tap"><div class="ring"></div><div class="dot"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="cta" class="center-block">
    <svg width="150" height="150" viewBox="0 0 100 100" style="display:block;margin:0 auto 26px">
      <defs><mask id="cres2"><rect width="100" height="100" fill="#fff"/><circle cx="66" cy="38" r="36" fill="#000"/></mask></defs>
      <circle cx="50" cy="50" r="40" fill="#B4A6FF" mask="url(#cres2)"/>
    </svg>
    <div class="brand">Qamar</div>
    <div class="sub" data-k="cta.sub"></div>
    <div class="store" data-k="cta.button"></div>
    <div class="handle" data-k="cta.handle"></div>
  </div>

  <div id="dots"></div>
</div>

<script>
/* =====================================================================
   КОНФИГ — тексты и тайминг.
   ===================================================================== */
const CONFIG = {
  fps: 30,
  duration: 24,
  text: {
    hook: { kicker: 'QAMAR · МУСХАФ', title: 'Коран, который<br>хочется <em>открывать</em>', sub: '5 возможностей мусхафа в Qamar' },
    cta: { sub: 'Мусхаф всегда с тобой', button: 'qamar.web.app', handle: 'Ссылка в профиле ↑' },
  },
  // Порядок сцен фиксирован (см. renderScreen), меняются только подписи
  captions: [
    'Мусхаф с цветовым<br>таджвидом',
    'Нажми на аят —<br>транскрипция и перевод',
    'Слушай чтеца —<br>аят подсвечивается',
    'Ночная тема<br>для чтения в темноте',
    'Заметки и закладки<br>к каждому аяту',
  ],
};

/* ---------- Таймлайн ---------- */
const HOOK_END = 2.8, CTA_LEN = 3.2;
const N = CONFIG.captions.length;
const FEAT_LEN = (CONFIG.duration - HOOK_END - CTA_LEN) / N;
const CTA_START = CONFIG.duration - CTA_LEN;
const S = i => HOOK_END + i * FEAT_LEN;      // начало сцены i

/* ---------- Утилиты анимации ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const backOut = k => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const $ = s => document.querySelector(s);
const css = (el, o) => Object.assign(el.style, o);

/* ---------- Построение DOM ---------- */
function build() {
  document.querySelectorAll('[data-k]').forEach(el => {
    el.innerHTML = el.dataset.k.split('.').reduce((o, k) => o[k], CONFIG.text);
  });
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const stars = $('#stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div'); s.className = 'star';
    const r = 1 + rnd() * 2.6;
    css(s, { left: rnd() * 1080 + 'px', top: rnd() * 1920 + 'px', width: r + 'px', height: r + 'px' });
    s.dataset.ph = rnd() * 6.28; s.dataset.sp = .6 + rnd() * 1.6;
    stars.appendChild(s);
  }
  $('#caption').innerHTML = CONFIG.captions.map((c, i) =>
    `<div class="cap"><span class="num">${String(i + 1).padStart(2, '0')}</span><h2>${c}</h2></div>`).join('');
  $('#dots').innerHTML = '<i></i>'.repeat(N);
}

/* ---------- Наезд камеры на экран: [t, scale, originX%, originY%] ---------- */
const CAM = [
  [0, 1.25, 50, 12],
  [S(0), 1.25, 50, 12], [S(1) - .2, 1.35, 50, 12],
  [S(1), 1.25, 50, 15], [S(1) + 1.3, 1.25, 50, 15], [S(1) + 2.2, 2.0, 50, 100], [S(2) - .2, 2.05, 50, 100],
  [S(2), 1.3, 50, 100], [S(3) - .2, 1.4, 50, 100],
  [S(3), 1.25, 50, 12], [S(4) - .2, 1.32, 50, 12],
  [S(4), 1.25, 50, 15], [S(4) + .9, 1.25, 50, 15], [S(4) + 1.6, 1.3, 50, 45], [S(5) - .2, 1.35, 50, 45],
  [99, 1.35, 50, 45],
];
function camera(t) {
  let i = 0; while (i < CAM.length - 2 && CAM[i + 1][0] <= t) i++;
  const [a, b] = [CAM[i], CAM[i + 1]];
  const k = easeInOut(prog(t, a[0], b[0]));
  return a.slice(1).map((v, j) => lerp(v, b[j + 1], k));
}

/* ---------- Экран приложения ---------- */
// top/bottom: показывать только полосу [top%, bottom%] скриншота; dy — сдвиг слоя в % высоты
const layer = (id, opacity, { top = 0, bottom = 100, dy = 0 } = {}) => css($('#L-' + id), {
  opacity, transform: `translateY(${dy}%)`,
  clipPath: `inset(${top}% 0 ${100 - bottom}% 0)`,
});

function renderScreen(t) {
  const lt = i => t - S(i);

  // 01 — страница мусхафа
  layer('page-zoom', 1);

  // 02 — касание аята → карточка с транскрипцией и переводом
  layer('page', easeOut(prog(lt(1), -.15, .25)));
  layer('card-top', easeOut(prog(lt(1), .95, 1.2)), { bottom: 80 });
  const card = easeOut(prog(lt(1), 1.05, 1.6));
  layer('card', card > 0 ? 1 : 0, { top: 80, dy: (1 - card) * 22 });

  // 03 — аудиоплеер
  layer('audio-top', easeOut(prog(lt(2), .25, .7)), { bottom: 84 });
  const pl = easeOut(prog(lt(2), .3, .85));
  layer('player', pl > 0 ? 1 : 0, { top: 84, dy: (1 - pl) * 17 });

  // 04 — ночная тема: круговое раскрытие из правого верхнего угла
  const nk = easeInOut(prog(lt(3), .6, 1.5));
  css($('#L-night'), { opacity: nk > 0 ? 1 : 0, clipPath: `circle(${nk * 135}% at 92% 4%)` });

  // 05 — заметка: затемнение + шторка снизу
  layer('note-top', easeOut(prog(lt(4), .95, 1.3)), { bottom: 34.5 });
  const sh = easeOut(prog(lt(4), 1.0, 1.55));
  layer('note-sheet', sh > 0 ? 1 : 0, { top: 34, dy: (1 - sh) * 70 });

  // касания пальцем: [сцена, момент, x%, y%]
  const taps = [[1, .85, 63.7, 36.7], [4, .6, 63.7, 36.7]];
  const tapEl = $('#tap');
  let shown = false;
  for (const [i, at, x, y] of taps) {
    const k = lt(i);
    if (k < at - .4 || k > at + .75) continue;
    shown = true;
    const appear = easeOut(prog(k, at - .4, at - .05));
    const gone = prog(k, at + .45, at + .75);
    const press = prog(k, at, at + .15), ring = prog(k, at, at + .55);
    css(tapEl, { left: x + '%', top: `calc(${y}% + ${(1 - appear) * 50}px)`, opacity: appear * (1 - gone) });
    css(tapEl.querySelector('.dot'), { transform: `scale(${1 - .2 * Math.sin(Math.PI * press)})` });
    css(tapEl.querySelector('.ring'), { transform: `scale(${.5 + ring * .9})`, opacity: k >= at ? 1 - ring : 0 });
  }
  if (!shown) tapEl.style.opacity = 0;

  const [sc, ox, oy] = camera(t);
  css($('#content'), { transform: `scale(${sc})`, transformOrigin: `${ox}% ${oy}%` });
}

/* ---------- Кадр ---------- */
function renderFrame(t) {
  document.querySelectorAll('.star').forEach(s =>
    s.style.opacity = .25 + .55 * (.5 + .5 * Math.sin(t * s.dataset.sp + +s.dataset.ph)));
  css($('#glow'), { transform: `translateY(${Math.sin(t * .5) * 30}px)` });

  // хук
  const hIn = easeOut(prog(t, 0, .9)), hOut = easeInOut(prog(t, HOOK_END - .5, HOOK_END));
  css($('#hook'), { opacity: hIn * (1 - hOut), transform: `translateY(${(1 - hIn) * 60 - hOut * 140}px)` });
  $('#moon-cut').setAttribute('cx', lerp(110, 66, easeOut(prog(t, .1, 1.4))));
  $('#moon').style.transform = `rotate(${lerp(-30, 0, easeOut(prog(t, 0, 1.4)))}deg)`;

  // iPad: въезд снизу и выезд к CTA
  const inK = backOut(prog(t, HOOK_END - .35, HOOK_END + .75));
  const outK = easeInOut(prog(t, CTA_START - .2, CTA_START + .6));
  const tilt = lerp(14, 0, easeOut(prog(t, HOOK_END - .35, HOOK_END + 1)));
  const breath = 1 + .01 * Math.sin(t * 1.3);
  css($('#ipad-wrap'), {
    transform: `perspective(2400px) translateY(${(1 - inK) * 1300 + outK * 1400}px) rotateX(${tilt}deg) scale(${breath * lerp(1, .8, outK)})`,
    opacity: t < HOOK_END - .4 ? 0 : 1,
  });

  // подписи и прогресс
  const active = t >= HOOK_END && t < CTA_START;
  const fi = clamp(Math.floor((t - HOOK_END) / FEAT_LEN), 0, N - 1);
  document.querySelectorAll('.cap').forEach((c, i) => {
    const a = S(i), b = a + FEAT_LEN;
    const kin = easeOut(prog(t, a + .1, a + .6)), kout = easeInOut(prog(t, b - .3, b));
    css(c, { opacity: kin * (1 - kout), transform: `translateX(${(1 - kin) * 80 - kout * 80}px)` });
  });
  document.querySelectorAll('#dots i').forEach((d, i) => {
    const on = active && i === fi;
    css(d, { width: on ? '44px' : '14px', background: on ? 'var(--accent)' : (active && i < fi ? 'rgba(180,166,255,.55)' : 'rgba(255,247,232,.25)') });
  });
  $('#dots').style.opacity = active ? 1 : 0;

  renderScreen(t);

  // CTA
  const cIn = easeOut(prog(t, CTA_START + .25, CTA_START + 1.1));
  css($('#cta'), { opacity: cIn, transform: `translateY(${(1 - cIn) * 70}px)` });
}

build();
window.CONFIG = CONFIG;
window.renderFrame = renderFrame;
window.ready = document.fonts.ready.then(async () => {
  await Promise.all([...document.querySelectorAll('img')].map(i => i.decode().catch(() => {})));
  renderFrame(0);
  return true;
});
// предпросмотр в браузере: index.html?play
if (location.search.includes('play')) {
  const t0 = performance.now();
  const loop = () => { renderFrame(((performance.now() - t0) / 1000) % CONFIG.duration); requestAnimationFrame(loop); };
  window.ready.then(loop);
}
</script>
</body>
</html>
